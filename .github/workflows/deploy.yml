name: Deploy

# Runs on every push to main (and from Actions → Run workflow).
# Build is checked on the runner first; the VPS then rebuilds the frontend
# container and applies Prisma migrations. Postgres is not taken down.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cidb
      JWT_SECRET: ci-placeholder-secret-not-used-at-build-time
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-at-build-time

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [build]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          envs: DEPLOY_SHA,GITHUB_REPOSITORY,GITHUB_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail

            DEPLOY_PATH="${DEPLOY_PATH:-/opt/hospitium}"
            if ! echo "${DEPLOY_SHA}" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
              echo "Invalid DEPLOY_SHA"
              exit 1
            fi
            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              echo "ERROR: $DEPLOY_PATH is not a git clone. Clone HospitiumRIS here first."
              exit 1
            fi

            echo "--- Preserving production compose / env ---"
            preserve() {
              if [ -f "$1" ]; then
                cp -a "$1" "/tmp/hospitium-preserve-$(basename "$1")"
              fi
            }
            restore() {
              local tmp="/tmp/hospitium-preserve-$(basename "$1")"
              if [ -f "$tmp" ]; then
                mv "$tmp" "$1"
              fi
            }
            preserve docker-compose.yml
            preserve docker-compose.override.yml
            preserve docker-compose.prod.yml

            echo "--- Updating code to ${DEPLOY_SHA} ---"
            git fetch --prune origin "+refs/heads/main:refs/remotes/origin/main" || true
            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              git fetch origin "${DEPLOY_SHA}" || \
                git -c http.extraHeader="Authorization: Bearer ${GITHUB_TOKEN}" \
                  fetch "https://github.com/${GITHUB_REPOSITORY}.git" "${DEPLOY_SHA}"
            fi
            git reset --hard "${DEPLOY_SHA}"

            restore docker-compose.yml
            restore docker-compose.override.yml
            restore docker-compose.prod.yml

            echo "--- Building frontend, migrating DB, restarting app ---"
            bash scripts/deploy.sh
